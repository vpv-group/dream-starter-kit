# CI for an ejected Dream Starter Kit module repo (dropped in by
# `pnpm mod eject`). Compat ranges are tested claims: the module is
# installed into a fresh kit clone and the full gates run against it.
name: Module CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifest version must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "version: \"$TAG\"" module.config.ts || {
            echo "module.config.ts version does not match tag $TAG"; exit 1; }
          grep -q "\"version\": \"$TAG\"" package.json || {
            echo "package.json version does not match tag $TAG"; exit 1; }

  install-into-kit:
    runs-on: ubuntu-latest
    env:
      # TODO(eject): pin your kit repo, the ref you test against, and the
      # kitCompat bounds you support.
      KIT_REPO: vpv-group/dream-starter-kit
      KIT_REF: main
    steps:
      - uses: actions/checkout@v4
        with:
          path: module
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.KIT_REPO }}
          ref: ${{ env.KIT_REF }}
          path: kit
      - uses: pnpm/action-setup@v4
        with:
          # No package.json at the job root: take pnpm's version from the kit.
          package_json_file: kit/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: kit/pnpm-lock.yaml
      - name: Install the module into the kit
        working-directory: kit
        run: |
          SLUG=$(grep -oP 'slug:\s*"\K[a-z0-9-]+' ../module/module.config.ts | head -1)
          mkdir -p "modules/$SLUG"
          rsync -a --exclude .git ../module/ "modules/$SLUG/"
          # Not --frozen-lockfile: the module may bring dependencies the
          # kit's lockfile doesn't have yet.
          pnpm install --no-frozen-lockfile
          pnpm mod sync
          pnpm typecheck
          # The module's own lint and format, as an app's CI runs them on
          # the install PR.
          pnpm -F "@acme/mod-$SLUG" --if-present lint
          pnpm -F "@acme/mod-$SLUG" --if-present format
          pnpm test
