<!--
  Supabase "Password changed" security notification.

  Sent after a user changes their password (config.toml
  [auth.email.notification.password_changed]) — e.g. from /profile on web or
  native (docs/AUTH.md -> Account settings). An informational notice with no
  link: if the user didn't make the change, they reset their password.

  Hosted Supabase does not read this file — turn on and paste the same markup
  in the Dashboard (Authentication -> Emails -> Security notifications ->
  Password changed). See README -> Deploy.
-->
<h2>Your password was changed</h2>

<p>The password for <strong>{{ .Email }}</strong> was just changed.</p>

<p>
  If this was you, there's nothing else to do. If it wasn't, reset your
  password right away from the sign-in page and review your account — someone
  may have access to it.
</p>
