# Dream updates (docs/MODULES.md → Automatic updates; docs/UPDATING.md).
#
# /admin and a daily schedule run this workflow. It runs the SAME `pnpm mod`
# CLI a developer would, pushes a branch and opens a pull request, so every
# change is a reviewable diff that the full CI gates before it can go live.
#
# Sign-in: no secrets. Each job trades its GitHub Actions OIDC token for a
# one-hour token for THIS repository from Meet Dream's "Dream Updates" GitHub
# App (.github/actions/dream-session), which the owner connects once in
# /admin → Updates. Until GitHub is connected every job ends with a notice.
#
# What runs:
#   check       daily: dispatch an update for each outdated module
#   kit-update  daily: a PR merging the newest PUBLISHED kit release (a vX.Y.Z
#               tag with a verified build attestation, never main)
#   op          add | update | remove one module (from /admin or `check`)
#   merge       after every CI run on an update branch (and daily): merges
#               the PRs that are ready, one at a time, under the owner's
#               settings (tooling/mod/src/ops/merge.ts → decideMerge)
#
# The logic lives in tested TypeScript (`pnpm mod ops …`); this file only
# wires it to GitHub.
name: Module ops

on:
  workflow_dispatch:
    inputs:
      op:
        description: add | update | remove | kit-update | check | merge
        required: true
        type: choice
        options: [add, update, remove, kit-update, check, merge]
      source:
        description: "add: dream:<slug>[@x.y.z] (or, run by a person: a GitHub url[#vX.Y.Z]). update: optional new origin, e.g. dream:<slug>"
        required: false
        type: string
      slug:
        description: "update/remove: module slug"
        required: false
        type: string
      version:
        description: "update: target version (vX.Y.Z; empty = latest)"
        required: false
        type: string
      keep_data:
        description: "remove: keep tables (skip the drop migration)"
        required: false
        default: "false"
        type: string
      approved:
        description: "true when an admin clicked Install/Update in /admin: the PR merges once checks pass"
        required: false
        default: "false"
        type: string
      pr:
        description: "merge: the PR an admin chose with Merge now in /admin (counts as approved)"
        required: false
        type: string
  schedule:
    - cron: "23 6 * * *"
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  # Sign in to Meet Dream (no stored secret).
  id-token: write

jobs:
  check:
    if: github.event_name == 'schedule' || inputs.op == 'check'
    runs-on: ubuntu-latest
    concurrency:
      group: module-ops-check
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: dream
        uses: ./.github/actions/dream-session
      - name: Dispatch updates for outdated modules
        if: steps.dream.outputs.connected == 'true' && steps.dream.outputs.auto_update == 'true'
        env:
          GH_TOKEN: ${{ steps.dream.outputs.token }}
          PAUSED: ${{ steps.dream.outputs.paused }}
        run: |
          pnpm --silent mod status --json > /tmp/status.json || exit 0
          for slug in $(jq -r '.[] | select(.updateAvailable) | .slug' /tmp/status.json); do
            case ",$PAUSED," in *",$slug,"*) echo "Updates for $slug are paused in /admin."; continue ;; esac
            gh workflow run module-ops.yml --repo "$GITHUB_REPOSITORY" -f op=update -f slug="$slug"
          done

  op:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["add","update","remove"]'), inputs.op)
    runs-on: ubuntu-latest
    concurrency:
      group: module-ops-op-${{ inputs.slug || inputs.source }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: dream
        uses: ./.github/actions/dream-session
      - name: Needs GitHub connected
        if: steps.dream.outputs.connected != 'true'
        run: |
          echo "::error title=Connect GitHub first::Open /admin → Updates and connect GitHub, then try again."
          exit 1

      # Runs started by the app (a bot) may only install from the Dream
      # catalog. A person running the workflow by hand may use any source.
      - name: Check the source
        env:
          ACTOR: ${{ github.triggering_actor }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [[ "$ACTOR" == *"[bot]" && -n "$SOURCE" && ! "$SOURCE" =~ ^dream:[a-z][a-z0-9-]*(@v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)?$ ]]; then
            echo "::error title=Catalog modules only::Installs started from /admin must come from the Dream catalog (dream:<slug>). Got: $SOURCE"
            exit 1
          fi

      - name: Sign git in as Dream Updates
        env:
          TOKEN: ${{ steps.dream.outputs.token }}
        run: |
          git config user.name "dream-updates[bot]"
          git config user.email "dream-updates[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # refs/ext-base/* = snapshots from before modules were renamed.
          git fetch origin '+refs/mod-base/*:refs/mod-base/*' || true
          git fetch origin '+refs/ext-base/*:refs/ext-base/*' || true
          cp modules.lock /tmp/lock-before.json 2>/dev/null || echo '{}' > /tmp/lock-before.json

      - name: Run the CLI
        id: cli
        env:
          OP: ${{ inputs.op }}
          SLUG: ${{ inputs.slug }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
          KEEP_DATA: ${{ inputs.keep_data }}
        run: |
          set -euo pipefail
          case "$OP" in
            add)
              pnpm mod add "$SOURCE" | tee /tmp/mod-op.log
              ;;
            update)
              ARGS=()
              [ -n "$VERSION" ] && ARGS+=(--to "$VERSION")
              [ -n "$SOURCE" ] && ARGS+=(--from "$SOURCE")
              # Merge conflicts exit non-zero but still make a PR (markers and
              # all). Any other failure must fail here.
              if ! pnpm mod update "$SLUG" "${ARGS[@]}" 2>&1 | tee /tmp/mod-op.log; then
                if grep -q "^Merge conflicts in:" /tmp/mod-op.log; then
                  echo "conflicts=true" >> "$GITHUB_OUTPUT"
                else
                  exit 1
                fi
              fi
              ;;
            remove)
              ARGS=()
              [ "$KEEP_DATA" = "true" ] && ARGS+=(--keep-data)
              pnpm mod remove "$SLUG" "${ARGS[@]}" | tee /tmp/mod-op.log
              ;;
          esac
          pnpm --silent mod ops describe --op "$OP" --before /tmp/lock-before.json --slug "$SLUG" >> "$GITHUB_OUTPUT"

      # An op can change nothing, e.g. `update` when the newest tag is the
      # version already installed. End with a notice instead of an empty PR.
      - name: Check for changes
        id: changes
        env:
          OP: ${{ inputs.op }}
          SLUG: ${{ steps.cli.outputs.slug || inputs.slug }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Nothing to update::pnpm mod $OP $SLUG changed nothing (an update installs the module's newest release)."

      # Module code queries its own tables through the typed client, so the
      # migrations must be applied before types are generated. A conflicted
      # update has markers in its files: skip, a person resolves them.
      - name: Setup Supabase CLI
        if: steps.changes.outputs.changed == 'true' && steps.cli.outputs.conflicts != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Regenerate types + typecheck the module
        if: steps.changes.outputs.changed == 'true' && steps.cli.outputs.conflicts != 'true'
        env:
          SLUG: ${{ steps.cli.outputs.slug }}
          OP: ${{ inputs.op }}
        run: |
          set -euo pipefail
          supabase start -x studio,logflare,vector,edge-runtime
          # Both gen-types scripts run prettier on their output. No `|| true`:
          # the `>` redirect empties the file before the CLI runs.
          pnpm db:gen-types
          pnpm cms:gen-types
          # The PR's own CI typechecks the whole workspace; this only catches
          # a module that doesn't compile against this kit, quickly.
          if [ "$OP" != "remove" ] && [ -n "$SLUG" ]; then
            pnpm -F "@acme/mod-$SLUG" --if-present typecheck
          fi

      - name: Path confinement check
        if: steps.changes.outputs.changed == 'true'
        run: |
          # The op may only touch modules/**, the known sync outputs and
          # lockfiles: a module can't smuggle a modified proxy.ts or workflow
          # into the PR (MODULES-PLAN.md §7).
          git add -A
          BAD=$(git diff --cached --name-only | grep -vE '^(modules/|modules\.lock|pnpm-lock\.yaml|\.env\.example|supabase/(migrations|functions)/|apps/nextjs/(mod-packages\.generated\.json|src/(lib/db/supabase-migrations\.generated\.json|mod/|payload/migrations/|app/\(frontend\)/.*x/|app/\(frontend\)/\(app\)/(a|billing)/|app/\(frontend\)/\(public\)/pricing/))|apps/expo/(package\.json|src/(mod/|app/\(app\)/))|apps/nextjs/package\.json|packages/(api|cms)/src/)' || true)
          # `mod sync` adds/removes the module's workspace dependency in both
          # apps' package.json: allowed ONLY for "@acme/mod-<slug>" lines.
          for f in apps/nextjs/package.json apps/expo/package.json; do
            if git diff --cached -U0 -- "$f" | grep -E '^[+-] ' \
                | grep -vqE '^[+-] +"@acme/mod-[a-z0-9-]+": "workspace:\*",?$'; then
              BAD="$BAD"$'\n'"$f (changes other than @acme/mod-* workspace dependencies)"
            fi
          done
          BAD=$(echo "$BAD" | sed '/^$/d')
          if [ -n "$BAD" ]; then
            echo "Files outside the allowlist were modified:"; echo "$BAD"; exit 1
          fi

      - name: Push branch + open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.dream.outputs.token }}
          OP: ${{ inputs.op }}
          SLUG: ${{ steps.cli.outputs.slug || inputs.slug }}
          SOURCE: ${{ inputs.source }}
          FROM: ${{ steps.cli.outputs.from }}
          TO: ${{ steps.cli.outputs.to }}
          MARKER: ${{ steps.cli.outputs.marker }}
          CONFLICTS: ${{ steps.cli.outputs.conflicts == 'true' }}
          APPROVED: ${{ inputs.approved == 'true' }}
        run: |
          set -euo pipefail
          BRANCH="dream/$OP-${SLUG:-new}-$GITHUB_RUN_ID"
          git checkout -b "$BRANCH"
          git commit -m "chore(mod): $OP ${SLUG:-$SOURCE}${TO:+ $TO}"
          git push -u origin "$BRANCH"
          git push origin 'refs/mod-base/*:refs/mod-base/*' || true

          case "$OP" in
            add) TITLE="Install ${SLUG:-$SOURCE}${TO:+ $TO}" ;;
            update) TITLE="Update $SLUG${FROM:+ $FROM →}${TO:+ $TO}" ;;
            remove) TITLE="Remove $SLUG" ;;
          esac
          BODY="Automated \`pnpm mod $OP\` run by Dream Updates. Review the full diff: module code runs server-side with env access (docs/MODULES-PLAN.md §7)."
          LABELS=(dream-update)
          if [ "$OP" = "remove" ]; then
            BODY="$BODY"$'\n\n'"⚠️ **Data loss:** this PR includes a drop migration for the module's tables (unless kept). It never merges itself."
            LABELS+=(dream-remove)
          fi
          if [ "$CONFLICTS" = "true" ]; then
            FILES=$(grep -rlE '^(<<<<<<<|>>>>>>>) ' "modules/$SLUG" 2>/dev/null | head -40 | sed 's/.*/\x60&\x60/' | tr '\n' ' ')
            BODY="$BODY"$'\n\n'"⚠️ **Merge conflicts to resolve** (markers committed; types were not regenerated): ${FILES:-see the branch}. Resolve them, run \`pnpm mod update $SLUG --continue\`, \`pnpm db:gen-types\` and \`pnpm cms:gen-types\`, then push. It never merges itself."
            TITLE="$TITLE (conflicts to resolve)"
            LABELS+=(dream-update-conflicts)
          fi
          # Clicking Install or Update in /admin is the approval.
          [ "$APPROVED" = "true" ] && [ "$OP" != "remove" ] && LABELS+=(dream-approved)
          BODY="$BODY"$'\n\n'"$MARKER"

          ensure_label() {
            gh label create "$1" --color "$2" --description "$3" 2>/dev/null || true
          }
          ensure_label dream-update 5319e7 "Automated Dream update"
          ensure_label dream-update-conflicts d93f0b "Dream update with conflicts to resolve"
          ensure_label dream-remove b60205 "Removes a module and its data"
          ensure_label dream-approved 0e8a16 "Approved in /admin: merges when checks pass"
          ensure_label dream-review fbca04 "A Dream update that needs a person"
          PR_URL=$(gh pr create --title "$TITLE" --body "$BODY")
          for label in "${LABELS[@]}"; do
            gh pr edit "$PR_URL" --add-label "$label" || echo "::warning::Couldn't add $label to $PR_URL"
          done
          echo "Opened $PR_URL"

  kit-update:
    # Free Dream Starter Kit updates: merges the kit's newest PUBLISHED release
    # (a vX.Y.Z tag from the kit's release.yml, never main, never a
    # pre-release) after verifying its build attestation. Kit PRs land as a
    # merge commit, never a squash, so the next one stays a plain three-way
    # merge. Skipped in the kit's own repository.
    if: >-
      github.repository != 'vpv-group/dream-starter-kit' &&
      (github.event_name == 'schedule' || inputs.op == 'kit-update')
    runs-on: ubuntu-latest
    concurrency:
      group: module-ops-kit
    env:
      UPSTREAM_URL: https://github.com/vpv-group/dream-starter-kit.git
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: dream
        uses: ./.github/actions/dream-session
      # The schedule respects "I'll update it myself"; a click in /admin
      # ("Check now") always runs.
      - name: Is this on?
        id: on
        env:
          CONNECTED: ${{ steps.dream.outputs.connected }}
          AUTO: ${{ steps.dream.outputs.auto_update }}
          EVENT: ${{ github.event_name }}
          PAUSED: ${{ steps.dream.outputs.paused }}
        run: |
          RUN=true
          if [ "$CONNECTED" != "true" ]; then RUN=false; fi
          if [ "$EVENT" = "schedule" ] && [ "$AUTO" != "true" ]; then RUN=false; fi
          case ",$PAUSED," in *",kit,"*) [ "$EVENT" = "schedule" ] && RUN=false ;; esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Find the latest kit release
        id: plan
        if: steps.on.outputs.run == 'true'
        env:
          TOKEN: ${{ steps.dream.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "dream-updates[bot]"
          git config user.email "dream-updates[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A Vercel clone or "Use this template" repo shares no history with
          # the kit: record the release it started from as an ancestor (no
          # file changes), once, so updates are normal three-way merges.
          pnpm --silent mod ops baseline --upstream "$UPSTREAM_URL" --apply | tee /tmp/baseline.txt
          if grep -q '^action=merge' /tmp/baseline.txt; then
            git push origin HEAD || echo "::notice title=Kit history recorded in the update PR::Branch protection kept the history-only commit off the default branch; it lands with the kit update PR instead."
          fi
          pnpm --silent mod ops kit-plan --upstream "$UPSTREAM_URL" --github-output | tee -a "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.on.outputs.run == 'true' && steps.plan.outputs.action != 'merge'
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          LATEST: ${{ steps.plan.outputs.latest }}
        run: |
          if [ "$ACTION" = "no-release" ]; then
            echo "::notice title=No kit release yet::The Dream Starter Kit hasn't published a vX.Y.Z release yet."
          else
            echo "::notice title=Kit is up to date::Already includes Dream Starter Kit $LATEST."
          fi

      # Only a release built by the kit's own release.yml may be merged: its
      # source archive (same command as release.yml) must carry a build
      # attestation from the kit's repository.
      - name: Verify the release attestation
        if: steps.plan.outputs.action == 'merge'
        env:
          GH_TOKEN: ${{ steps.dream.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          REF: ${{ steps.plan.outputs.ref }}
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="dream-starter-kit-$TAG/" -o "/tmp/dream-starter-kit-$TAG.tar" "$REF^{commit}"
          gh attestation verify "/tmp/dream-starter-kit-$TAG.tar" --repo vpv-group/dream-starter-kit

      - name: Merge the release
        id: merge
        if: steps.plan.outputs.action == 'merge'
        env:
          GH_TOKEN: ${{ steps.dream.outputs.token }}
          REF: ${{ steps.plan.outputs.ref }}
          TAG: ${{ steps.plan.outputs.tag }}
          LATEST: ${{ steps.plan.outputs.latest }}
          UNRELATED: ${{ steps.plan.outputs.unrelated }}
        run: |
          set -euo pipefail
          MSG="chore(kit): merge Dream Starter Kit $LATEST ($TAG)"
          # One open kit update at a time: refresh it instead of stacking.
          OPEN=$(gh pr list --state open --limit 200 --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("dream/kit-update-") or startswith("sync/upstream-"))][0] | select(.) | "\(.number) \(.headRefName)"')
          if [ -n "$OPEN" ]; then
            read -r PR BRANCH <<< "$OPEN"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if git merge-base --is-ancestor "$REF" HEAD; then
              echo "::notice title=Kit update PR is current::#$PR already has $LATEST."
              echo "result=current" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pr=$PR" >> "$GITHUB_OUTPUT"
          else
            BRANCH="dream/kit-update-$(date -u +%F)"
            git checkout -B "$BRANCH"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          ARGS=()
          # "Use this template" repos and Vercel clones share no history with
          # the kit: the first merge needs --allow-unrelated-histories.
          [ "$UNRELATED" = "true" ] && ARGS+=(--allow-unrelated-histories)
          if git merge --no-edit "${ARGS[@]}" -m "$MSG" "$REF"; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Generated files: take the release's side, regenerate below. Only
          # hand-written files are left for a person.
          pnpm --silent mod ops resolve-generated | tee /tmp/resolve.txt
          REMAINING=$(sed -n 's/^remaining=//p' /tmp/resolve.txt)
          if [ -z "$REMAINING" ]; then
            git commit --no-edit -m "$MSG"
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit --no-edit -m "$MSG — conflicts to resolve"
            echo "result=conflicts" >> "$GITHUB_OUTPUT"
            echo "conflicts=$REMAINING" >> "$GITHUB_OUTPUT"
          fi

      # A clean merge gets everything regenerated so the PR can merge with
      # no local work: lockfile, module registries, migrations bundle, types.
      - name: Setup Supabase CLI
        if: steps.merge.outputs.result == 'clean'
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0
      - name: Regenerate
        if: steps.merge.outputs.result == 'clean'
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm mod sync
          pnpm db:gen-migrations
          supabase start -x studio,logflare,vector,edge-runtime
          pnpm db:gen-types
          pnpm cms:gen-types
          git add -A
          git diff --cached --quiet || git commit -m "chore(kit): regenerate after the kit update"

      - name: Open or refresh the kit update PR
        if: steps.merge.outputs.result == 'clean' || steps.merge.outputs.result == 'conflicts'
        env:
          GH_TOKEN: ${{ steps.dream.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          PR: ${{ steps.merge.outputs.pr }}
          TAG: ${{ steps.plan.outputs.tag }}
          LATEST: ${{ steps.plan.outputs.latest }}
          CURRENT: ${{ steps.plan.outputs.current }}
          PUBLISHED_AT: ${{ steps.plan.outputs.published_at }}
          RESULT: ${{ steps.merge.outputs.result }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          set -euo pipefail
          git push --force-with-lease -u origin "$BRANCH"
          MARKER=$(jq -cn --arg from "$CURRENT" --arg to "$LATEST" --arg at "$PUBLISHED_AT" \
            '{kind:"kit",op:"kit-update",slug:"kit",from:$from,to:$to,verified:true,publishedAt:$at}')
          BODY="Dream Starter Kit **$CURRENT → $LATEST** (release \`$TAG\`; its build attestation was verified). Types, lockfile and generated files are regenerated, so it can merge as is.

          It lands as a **merge commit, never a squash**: squashing drops the record that the release is an ancestor (docs/UPDATING.md).

          <!-- dream-update $MARKER -->"
          if [ "$RESULT" = "conflicts" ]; then
            BODY="$BODY

          ⚠️ **Conflicts to resolve** (markers committed): $(echo "$CONFLICTS" | tr ' ' '\n' | head -40 | sed 's/.*/\x60&\x60/' | tr '\n' ' ')
          Then run \`pnpm install\`, \`pnpm db:gen-types\` and \`pnpm cms:gen-types\`. It never merges itself."
          fi
          gh label create dream-update --color 5319e7 --description "Automated Dream update" 2>/dev/null || true
          gh label create dream-update-conflicts --color d93f0b --description "Dream update with conflicts to resolve" 2>/dev/null || true
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "Update Dream Starter Kit $CURRENT → $LATEST" --body "$BODY"
            URL="$PR"
          else
            URL=$(gh pr create --head "$BRANCH" --title "Update Dream Starter Kit $CURRENT → $LATEST" --body "$BODY")
          fi
          gh pr edit "$URL" --add-label dream-update || true
          if [ "$RESULT" = "conflicts" ]; then
            gh pr edit "$URL" --add-label dream-update-conflicts || true
          else
            gh pr edit "$URL" --remove-label dream-update-conflicts 2>/dev/null || true
          fi
          echo "Kit update PR: $URL"

  merge:
    # After CI finishes on an update branch, on the daily schedule, or when
    # an admin clicks "Merge now": merge what is ready (one per run).
    if: >-
      github.event_name == 'schedule' || inputs.op == 'merge' ||
      (github.event_name == 'workflow_run' && (
        startsWith(github.event.workflow_run.head_branch, 'dream/') ||
        startsWith(github.event.workflow_run.head_branch, 'mod/') ||
        startsWith(github.event.workflow_run.head_branch, 'sync/upstream-')))
    runs-on: ubuntu-latest
    concurrency:
      group: module-ops-merge
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Merge ready updates
        env:
          APPROVE: ${{ inputs.pr }}
        run: |
          if [[ "$APPROVE" =~ ^[0-9]+$ ]]; then
            pnpm --silent mod ops merge --approve "$APPROVE"
          else
            pnpm --silent mod ops merge
          fi
