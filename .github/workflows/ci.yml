name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Leverage Vercel Remote Caching with Turbo to speed up builds.
# @link https://turborepo.com/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint && pnpm lint:ws

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Unit tests (vitest)
        run: pnpm test

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      # Fails only on strong copyleft (GPL/AGPL/SSPL) with no permissive option.
      - name: License check
        run: pnpm license:check

  # Integration: a real local Supabase stack (Postgres + Auth + Storage), the
  # RLS isolation regression, and the Playwright critical-path e2e against the
  # web app. This is the security + end-to-end gate.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: the kit's tables get their anon/authenticated grants from
          # Supabase DEFAULT PRIVILEGES, and CLI v2.106.0 (2026-06-11) ships a
          # local stack where migrations applied via `supabase start` no longer
          # receive them (RLS suite fails with 42501 permission denied). Bump
          # deliberately after verifying `pnpm test:rls` + `pnpm test:e2e`
          # against the new version locally.
          version: 2.105.0

      # One bootstrap for laptops, cloud sessions and CI (tooling/setup,
      # src/plan.ts + src/env-writer.ts, both unit-tested). The ci profile:
      #   - `supabase start` (applies migrations + seed);
      #   - TLS on the local Postgres with a throwaway self-signed cert
      #     (tooling/scripts/enable-supabase-db-tls.sh), so `sslmode=require`
      #     exercises the hosted-TLS path that once shipped a
      #     SELF_SIGNED_CERT_IN_CHAIN regression while CI stayed green;
      #   - a minimal .env from `supabase status` (local demo keys, not real
      #     secrets) with NO PAYLOAD_SECRET / PAYLOAD_DATABASE_URL, so the
      #     zero-touch derived-credentials path a fresh Vercel deploy takes
      #     is what runs;
      #   - drops the seeded payload_cms role + cms schema, mirroring a fresh
      #     hosted project (the runtime bootstrap must create both).
      - name: Bootstrap (pnpm dev:setup --profile ci)
        run: pnpm dev:setup --profile ci

      - name: RLS isolation regression
        run: pnpm test:rls
      # Supabase's Security + Performance Advisor lints against the migrated
      # database: unindexed foreign keys, auth.uid() not wrapped in a select,
      # overlapping permissive policies, duplicate indexes, RLS gaps. Fails on
      # any WARN (INFO notices such as fresh-DB unused indexes don't fail).
      - name: Database advisors
        run: pnpm db:advisors

      # Bundle-safety backstop for the module framework (MODULES-PLAN.md
      # §1.6): bundling the native app fails if any server-only import (the
      # `server-only` / payload poison pills) leaks into the Metro graph —
      # e.g. via a bad import in a third-party module's client barrel.
      - name: Expo export smoke check (native graph stays server-free)
        run: pnpm -F @acme/expo smoke:export

      # NOTE: the CMS is intentionally NOT pre-seeded here. Payload's dev push
      # (NODE_ENV!=production) creates the cms tables on boot, and the Playwright
      # `setup` project (founder.setup.ts) seeds demo content by signing up the
      # FIRST user — exercising the real signup→/cms-setup→seed path end-to-end —
      # so the public-content specs have data to render. Pre-seeding would mask
      # that path (the seed endpoint would no-op as already-seeded).
      - name: Install Playwright browser
        run: pnpm --filter @acme/web-e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tooling/web-e2e/playwright-report/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
