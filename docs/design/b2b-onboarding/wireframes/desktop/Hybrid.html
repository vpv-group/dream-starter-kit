<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How will you use Dream (desktop)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
<link rel="stylesheet" href="../assets/desktop.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr dk">
  <div class="dk-main">
    <div class="dk-top">
      <img src="../assets/dream-logo.svg" alt="Dream" style="height: 28px; width: auto">
      <span class="dk-meta">alex@acme.com</span>
    </div>

    <div class="dk-col dk-col-wide" style="max-width: 640px">
      <div class="dr-stephead">
        <h1 class="dr-title">How will you use Dream?</h1>
        <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--body)">You can create or join a workspace any time from your account menu.</p>
      </div>

      <fieldset class="dk-opts" style="margin: 0; padding: 0; border: 0">
        <legend class="dr-sr">How you will use Dream</legend>
        <label class="dk-opt">
          <input type="radio" name="use" value="self" class="dr-sr">
          <span class="dk-opt-head">
            <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="square"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
            <span class="dk-radio" aria-hidden="true"></span>
          </span>
          <span class="dk-opt-t">For myself</span>
          <span class="dk-opt-d">Your own account. Nothing is shared with anyone.</span>
        </label>
        <label class="dk-opt is-sel">
          <input type="radio" name="use" value="team" checked class="dr-sr">
          <span class="dk-opt-head">
            <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--foreground)" stroke-width="1.5" stroke-linecap="square"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14c2.8 0 4.5 2 4.5 5"></path></svg>
            <span class="dk-radio" aria-hidden="true"></span>
          </span>
          <span class="dk-opt-t">With my team</span>
          <span class="dk-opt-d">Create a workspace and invite the people you work with.</span>
        </label>
      </fieldset>

      <div style="display: flex; justify-content: flex-end">
        <a href="CreateWorkspace.html" class="dr-btn dr-btn-primary" style="min-width: 200px">Continue</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
