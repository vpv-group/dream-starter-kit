<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join Acme (desktop)</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
<link rel="stylesheet" href="../assets/desktop.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr dk">
  <div class="dk-split">
    <div class="dk-main">
      <div class="dk-top">
        <img src="../assets/dream-logo.svg" alt="Dream" style="height: 28px; width: auto">
      </div>

      <div class="dk-col">
        <span aria-hidden="true" class="dk-ws" style="width: 64px; height: 64px; border-radius: 14px; font-size: 28px">A</span>
        <div class="dr-stephead">
          <h1 class="dr-title">Join Acme</h1>
          <p class="dr-sm" style="color: var(--body)">Alex Morgan invited you to work together. You’ll join as a member.</p>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--surface-raised)">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="square"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <div style="display: flex; flex-direction: column">
            <span class="dr-sm dr-muted">Invite sent to</span>
            <span style="font: 400 15px/22px var(--font-mono); color: var(--foreground)">ana@acme.com</span>
          </div>
        </div>

        <a href="JoinSignIn.html" class="dr-btn dr-btn-primary dr-btn-block">Continue as ana@acme.com</a>
        <a href="InviteProblem.html" class="dr-btn dr-btn-ghost" style="align-self: center">Not you? Sign in with another account</a>
      </div>
    </div>

    <aside class="dk-aside" aria-label="About this workspace">
      <div class="dk-preview">
        <p class="dk-cap">You’re joining</p>
        <div class="dk-card">
          <div style="display: flex; align-items: center; gap: 12px">
            <span class="dk-ws" style="width: 44px; height: 44px; border-radius: 10px; font-size: 20px">A</span>
            <div style="display: flex; flex-direction: column">
              <span class="dr-h" style="font-size: 20px; line-height: 26px">Acme</span>
              <span class="dk-meta" style="font-family: var(--font-mono); font-size: 13px">app.meetdream.com/acme</span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border)">
            <div style="display: flex">
              <span class="dk-av">AM</span>
              <span class="dk-av" style="margin-left: -8px">S</span>
            </div>
            <span class="dk-meta">Alex Morgan and 1 other</span>
          </div>
        </div>
        <p class="dk-meta">Invited by Alex Morgan, Owner.</p>
      </div>
    </aside>
  </div>
</div>
</x-dc>
</body>
</html>
