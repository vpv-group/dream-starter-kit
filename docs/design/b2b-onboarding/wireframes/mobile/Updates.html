<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stay in the loop</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 34px; display: flex; flex-direction: column; gap: 24px; background: var(--background)">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 32px">
      <img src="../assets/dream-icon.svg" alt="Dream" style="height: 24px; width: auto">
      <span class="dr-sm dr-muted">Vyten</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <span class="dr-d" style="height: 6px; background: var(--brand)"></span>
      <span class="dr-d" style="height: 6px; background: var(--brand)"></span>
      <span class="dr-d" style="height: 6px; background: var(--brand)"></span>
      <span class="dr-d" style="height: 6px; background: var(--foreground)"></span>
    </div>
  </div>

  <div class="dr-stephead">
    <p class="dr-eyebrow">Step 04 <span class="sep">/</span> 04</p>
    <h1 class="dr-title">Stay in the loop</h1>
    <p class="dr-sm" style="color: var(--body)">Choose what we email you. Change this any time in Settings.</p>
  </div>

  <div style="display: flex; flex-direction: column">
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer">
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font: 600 17px/24px var(--font-sans); letter-spacing: -0.01em; color: var(--foreground)">Getting started tips</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--muted-foreground)">A short series for your first weeks.</span>
      </span>
      <input type="checkbox" role="switch" checked class="dr-sr">
      <span aria-hidden="true" style="flex: none; width: 44px; height: 26px; border-radius: 9999px; background: var(--primary); position: relative">
        <span style="position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 9999px; background: var(--primary-foreground)"></span>
      </span>
    </label>
    <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer">
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font: 600 17px/24px var(--font-sans); letter-spacing: -0.01em; color: var(--foreground)">Product updates</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--muted-foreground)">What’s new in Dream.</span>
      </span>
      <input type="checkbox" role="switch" class="dr-sr">
      <span aria-hidden="true" style="flex: none; width: 44px; height: 26px; border-radius: 9999px; background: var(--surface-raised); border: 1px solid var(--input); box-sizing: border-box; position: relative">
        <span style="position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 9999px; background: var(--card); box-shadow: var(--shadow-xs)"></span>
      </span>
    </label>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="Home.html" class="dr-btn dr-btn-primary dr-btn-block">Finish</a>
  </div>
</div>
</x-dc>
</body>
</html>
