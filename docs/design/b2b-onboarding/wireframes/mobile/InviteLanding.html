<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join Acme</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 34px; display: flex; flex-direction: column; gap: 24px; background: var(--background)">
  <div style="display: flex; align-items: center; height: 32px">
    <img src="../assets/dream-logo.svg" alt="Dream" style="height: 24px; width: auto">
  </div>

  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px; margin-top: 40px">
    <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 14px; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: center; font: 600 28px/1 var(--font-sans)">A</span>
    <div class="dr-stephead">
      <h1 class="dr-title">Join Acme</h1>
      <p class="dr-sm" style="color: var(--body)">Alex Morgan invited you to work together. You’ll join as a member.</p>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--surface-raised)">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="square"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
    <div style="display: flex; flex-direction: column">
      <span class="dr-sm dr-muted">Invite sent to</span>
      <span style="font: 400 15px/22px var(--font-mono); color: var(--foreground)">ana@acme.com</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="JoinSignIn.html" class="dr-btn dr-btn-primary dr-btn-block">Continue as ana@acme.com</a>
    <a href="InviteProblem.html" class="dr-btn dr-btn-ghost" style="align-self: center">Not you? Sign in with another account</a>
  </div>
</div>
</x-dc>
</body>
</html>
