<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setting up Vyten</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; position: relative; background: var(--background)">
  <img src="../assets/dream-icon.svg" alt="" style="width: 64px; height: 64px">
  <div style="display: flex; flex-direction: column; gap: 8px; text-align: center; width: 100%">
    <h1 class="dr-h">Setting up Vyten</h1>
    <p class="dr-sm" style="color: var(--body)">Adding your starter content. This usually takes a few seconds.</p>
  </div>
  <div class="dr-progress" style="width: 220px" role="progressbar" aria-label="Setting up" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
    <div class="track" style="height: 6px"><div class="fill" style="width: 60%"></div></div>
  </div>
  <p class="dr-sm dr-muted" style="position: absolute; bottom: 34px">Taking longer than usual? <a href="Profile.html">Continue</a></p>
</div>
</x-dc>
</body>
</html>
