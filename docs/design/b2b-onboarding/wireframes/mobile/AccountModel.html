<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who signs up for your app</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 34px; display: flex; flex-direction: column; gap: 24px; background: var(--background)">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 32px">
    <img src="../assets/dream-logo.svg" alt="Dream" style="height: 24px; width: auto">
    <span class="dr-tag">Admin setup</span>
  </div>

  <div class="dr-stephead">
    <p class="dr-eyebrow">Step 01 <span class="sep">/</span> 02</p>
    <h1 class="dr-title">Who signs up for your app?</h1>
    <p class="dr-sm" style="color: var(--body)">This sets how sign-up works. You can change it later in Admin › Authentication.</p>
  </div>

  <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 12px">
    <legend class="dr-sr">Account model</legend>

    <label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); cursor: pointer">
      <input type="radio" name="model" value="consumer" class="dr-sr">
      <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 9999px; border: 1.5px solid var(--input); box-sizing: border-box"></span>
      <span style="display: flex; flex-direction: column; gap: 4px; flex: 1">
        <span style="font: 600 17px/24px var(--font-sans); letter-spacing: -0.01em; color: var(--foreground)">Individuals</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--body)">Each person signs up for themselves. Members, customers, clients.</span>
      </span>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="square"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg>
    </label>

    <label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; border: 1px solid var(--primary); box-shadow: 0 0 0 1px var(--primary); background: var(--card); cursor: pointer">
      <input type="radio" name="model" value="business" checked class="dr-sr">
      <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 9999px; border: 6px solid var(--primary); box-sizing: border-box"></span>
      <span style="display: flex; flex-direction: column; gap: 4px; flex: 1">
        <span style="font: 600 17px/24px var(--font-sans); letter-spacing: -0.01em; color: var(--foreground)">Teams and companies</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--body)">People work together in a shared workspace. The first person creates it and invites the rest.</span>
      </span>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--foreground)" stroke-width="1.5" stroke-linecap="square"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M17 14c2.8 0 4.5 2 4.5 5"></path></svg>
    </label>

    <label style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); cursor: pointer">
      <input type="radio" name="model" value="hybrid" class="dr-sr">
      <span aria-hidden="true" style="flex: none; width: 20px; height: 20px; margin-top: 2px; border-radius: 9999px; border: 1.5px solid var(--input); box-sizing: border-box"></span>
      <span style="display: flex; flex-direction: column; gap: 4px; flex: 1">
        <span style="font: 600 17px/24px var(--font-sans); letter-spacing: -0.01em; color: var(--foreground)">Both</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--body)">Personal by default. Anyone can create or join a workspace later.</span>
      </span>
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linecap="square"><circle cx="8" cy="9" r="3"></circle><path d="M3 19c0-3 2.2-5 5-5"></path><rect x="12" y="11" width="9" height="9" rx="2"></rect></svg>
    </label>
  </fieldset>

  <div class="dr-stephead" style="gap: 4px">
    <div class="meta"><span>Who: <b>you, the admin</b></span><span>How long: <b>under a minute</b> (estimate)</span></div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <button type="button" class="dr-btn dr-btn-primary dr-btn-block">Continue</button>
    <p class="dr-sm dr-muted" style="text-align: center">Next we add sample content to your CMS.</p>
  </div>
</div>
</x-dc>
</body>
</html>
