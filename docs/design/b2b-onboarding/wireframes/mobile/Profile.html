<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set up your profile</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 34px; display: flex; flex-direction: column; gap: 28px; background: var(--background)">
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 32px">
      <img src="../assets/dream-icon.svg" alt="Dream" style="height: 24px; width: auto">
      <span class="dr-sm dr-muted">Acme</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px" aria-hidden="true">
      <span class="dr-d" style="height: 6px; background: var(--foreground)"></span>
      <span class="dr-d" style="height: 6px; background: var(--primary-tint)"></span>
      <span class="dr-d" style="height: 6px; background: var(--primary-tint)"></span>
      <span class="dr-d" style="height: 6px; background: var(--primary-tint)"></span>
    </div>
  </div>

  <div class="dr-stephead">
    <p class="dr-eyebrow">Step 01 <span class="sep">/</span> 04</p>
    <h1 class="dr-title">Set up your profile</h1>
    <p class="dr-sm" style="color: var(--body)">This is how your team sees you in Acme.</p>
  </div>

  <div style="display: flex; align-items: center; gap: 16px">
    <div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 9999px; background: var(--surface-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font: 600 24px/1 var(--font-sans); color: var(--foreground)">AM</div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <button type="button" class="dr-btn dr-btn-secondary dr-btn-sm">Upload a photo</button>
      <span class="dr-sm dr-muted">Square works best. You can crop it.</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px">
    <div class="dr-field" style="max-width: none">
      <label for="name">Full name</label>
      <input id="name" class="dr-input" value="Alex Morgan">
    </div>
    <div class="dr-field" style="max-width: none">
      <label for="title">Title</label>
      <input id="title" class="dr-input" placeholder="Founder, designer, coach…" value="Founder">
      <span class="help">Optional. Shown next to your name.</span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="Invite.html" class="dr-btn dr-btn-primary dr-btn-block">Continue</a>
    <a href="Invite.html" class="dr-btn dr-btn-secondary dr-btn-block">Do this later</a>
  </div>
</div>
</x-dc>
</body>
</html>
