<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name your workspace</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 34px; display: flex; flex-direction: column; gap: 24px; background: var(--background)">
  <div style="display: flex; align-items: center; height: 32px">
    <img src="../assets/dream-logo.svg" alt="Dream" style="height: 24px; width: auto">
  </div>

  <div class="dr-stephead" style="margin-top: 40px">
    <h1 class="dr-title">Name your workspace</h1>
    <p class="dr-sm" style="color: var(--body)">This is where your team works together. You can rename it later.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px">
    <div class="dr-field" style="max-width: none">
      <label for="ws-name">Workspace name</label>
      <input id="ws-name" class="dr-input" value="Vyten">
      <span class="help">Usually your company or team name.</span>
    </div>

    <div class="dr-field" style="max-width: none">
      <label for="ws-url">Workspace URL</label>
      <div style="display: flex; height: 48px; border-radius: 10px; border: 1px solid var(--input); background: var(--card); overflow: hidden">
        <span style="display: inline-flex; align-items: center; padding: 0 4px 0 16px; background: var(--surface-raised); color: var(--muted-foreground); font: 400 15px/1 var(--font-mono); border-right: 1px solid var(--border)">app.meetdream.com/</span>
        <input id="ws-url" value="vyten" style="flex: 1; min-width: 0; border: 0; padding: 0 12px; background: none; color: var(--foreground); font: 400 15px/1 var(--font-mono); outline-offset: -2px">
      </div>
      <span class="help" style="display: inline-flex; align-items: center; gap: 6px; color: var(--success)">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M2 6.5L4.8 9.3L10.2 3.6"></path></svg>
        Available
      </span>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 16px">
    <a href="SettingUp.html" class="dr-btn dr-btn-primary dr-btn-block">Create workspace</a>
    <p class="dr-sm dr-muted" style="text-align: center">Signed in as vincent@vyten.com · <a href="SignUp.html">Use a different email</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
