<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create your workspace</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div class="dr" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 16px 34px; display: flex; flex-direction: column; gap: 24px; background: var(--background)">
  <div style="display: flex; align-items: center; height: 32px">
    <img src="../assets/dream-logo.svg" alt="Dream" style="height: 24px; width: auto">
  </div>

  <div class="dr-stephead" style="margin-top: 40px">
    <h1 class="dr-title">Create your workspace</h1>
    <p class="dr-sm" style="color: var(--body)">Free to start. You’ll name your workspace after you confirm your email.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div class="dr-field" style="max-width: none">
      <label for="email">Work email</label>
      <input id="email" type="email" class="dr-input" placeholder="you@company.com" value="vincent@vyten.com">
      <span class="help">We’ll send a 6-digit code to confirm it’s you.</span>
    </div>
    <a href="CheckEmail.html" class="dr-btn dr-btn-primary dr-btn-block">Continue with email</a>
    <p class="dr-sm dr-muted" style="text-align: center">You used email last time.</p>
  </div>

  <div style="display: flex; align-items: center; gap: 12px" aria-hidden="true">
    <span style="flex: 1; height: 1px; background: var(--border)"></span>
    <span class="dr-sm dr-muted">or</span>
    <span style="flex: 1; height: 1px; background: var(--border)"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <button type="button" class="dr-btn dr-btn-secondary dr-btn-block">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><path d="M20 12.2c0-.6-.1-1.2-.2-1.7H12v3.3h4.5a3.9 3.9 0 0 1-1.7 2.5"></path><path d="M12 20a8 8 0 1 1 5.3-14"></path></svg>
      Continue with Google
    </button>
    <button type="button" class="dr-btn dr-btn-secondary dr-btn-block">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      Continue with SAML SSO
    </button>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; text-align: center">
    <p class="dr-sm dr-muted">By continuing you agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
    <p class="dr-sm" style="color: var(--body)">Already have an account? <a href="#">Sign in</a></p>
  </div>
</div>
</x-dc>
</body>
</html>
